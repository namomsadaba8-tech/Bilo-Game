<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1b5e20">
  <link rel="manifest" href="manifest.json">
  <title>Bilo Game</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #e8f5e9, #b9f6ca);
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 { color: #1b5e20; }

    .card {
      background: white;
      padding: 25px;
      border-radius: 25px;
      box-shadow: 0 8px 20px rgba(0,0,0,.15);
      margin-top: 20px;
    }

    input {
      width: 90%;
      max-width: 400px;
      font-size: 20px;
      padding: 14px;
      border-radius: 12px;
      border: 2px solid #81c784;
      margin: 15px 0;
      text-align: center;
    }

    button {
      font-size: 18px;
      padding: 14px 18px;
      margin: 7px;
      border-radius: 15px;
      border: none;
      background: white;
      box-shadow: 0 4px 8px rgba(0,0,0,.15);
      cursor: pointer;
    }

    button:active {
      transform: scale(.95);
    }

    .startBtn {
      background: #2e7d32;
      color: white;
      font-weight: bold;
      width: 80%;
    }

    .soundBtn {
      background: #1565c0;
      color: white;
    }

    .info {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.8;
      background: #f1f8e9;
      padding: 12px;
      border-radius: 15px;
      margin: 15px 0;
    }

    #animal {
      font-size: 110px;
      margin: 20px;
      animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }

    .animalBtn {
      min-width: 130px;
    }

    #message {
      font-size: 22px;
      font-weight: bold;
      min-height: 30px;
    }

    #gameScreen,
    #gameOver {
      display: none;
    }

    .gameOverTitle {
      color: #c62828;
    }

    .restartBtn {
      background: #1565c0;
      color: white;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- START -->
  <div id="startScreen" class="card">

    <h1>🦁 BILO GAME 🐘</h1>

    <h2>🎮 Baga Nagaan Dhuftan!</h2>

    <p>Game bineensotaa taphadhu!</p>

    <p>👤 Maqaa kee galchi:</p>

    <input
      id="playerName"
      type="text"
      placeholder="Maqaa kee"
    >

    <br>

    <button class="startBtn" onclick="startGame()">
      ▶️ START GAME
    </button>

  </div>


  <!-- GAME -->
  <div id="gameScreen" class="card">

    <h1>🦁 Bilo Game</h1>

    <p>
      👤 Player:
      <strong><span id="name"></span></strong>
    </p>

    <button class="soundBtn" onclick="toggleSound()">
      🔊 SOUND: ON
    </button>

    <div class="info">
      ⭐ Point: <span id="score">0</span>
      <br>
      ❤️ Lives: <span id="lives">3</span>
      <br>
      🏆 Level: <span id="level">1</span>
    </div>

    <h2>Bineensa kana tuqi 👇</h2>

    <div id="animal">🦁</div>

    <button class="animalBtn" onclick="checkAnimal('🦁')">
      🦁 Leenca
    </button>

    <button class="animalBtn" onclick="checkAnimal('🐘')">
      🐘 Arbaa
    </button>

    <button class="animalBtn" onclick="checkAnimal('🐒')">
      🐒 Jaldeessa
    </button>

    <button class="animalBtn" onclick="checkAnimal('🐕')">
      🐕 Saree
    </button>

    <p id="message">Bineensa sirrii tuqi! 👆</p>

  </div>


  <!-- GAME OVER -->
  <div id="gameOver" class="card">

    <h1 class="gameOverTitle">💔 GAME OVER</h1>

    <h2 id="finalMessage"></h2>

    <h2>
      ⭐ Point kee:
      <span id="finalScore">0</span>
    </h2>

    <button class="restartBtn" onclick="restartGame()">
      🔄 RESTART
    </button>

  </div>

</div>


<script>

  let score = 0;
  let lives = 3;
  let level = 1;
  let correctAnimal = "";
  let soundOn = true;
  let audioCtx = null;

  const animals = [
    "🦁",
    "🐘",
    "🐒",
    "🐕"
  ];


  // SAGALEE
  function playSound(type) {

    if (!soundOn) return;

    if (!audioCtx) {
      audioCtx = new (
        window.AudioContext ||
        window.webkitAudioContext
      )();
    }

    const oscillator = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    oscillator.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === "correct") {
      oscillator.frequency.value = 700;
    }

    if (type === "wrong") {
      oscillator.frequency.value = 180;
    }

    if (type === "level") {
      oscillator.frequency.value = 1000;
    }

    gain.gain.value = 0.15;

    oscillator.start();

    setTimeout(function () {
      oscillator.stop();
    }, 250);
  }


  // SOUND ON / OFF
  function toggleSound() {

    soundOn = !soundOn;

    const button =
      document.querySelector(".soundBtn");

    if (soundOn) {
      button.innerText = "🔊 SOUND: ON";
    } else {
      button.innerText = "🔇 SOUND: OFF";
    }
  }


  // START GAME
  function startGame() {

    const name =
      document.getElementById("playerName").value;

    if (name.trim() === "") {
      alert("Maaloo maqaa kee galchi!");
      return;
    }

    document.getElementById("name").innerText =
      name;

    document.getElementById("startScreen")
      .style.display = "none";

    document.getElementById("gameScreen")
      .style.display = "block";

    score = 0;
    lives = 3;
    level = 1;

    updateInfo();
    newRound();
  }


  // HAARAA
  function newRound() {

    const random =
      Math.floor(
        Math.random() * animals.length
      );

    correctAnimal = animals[random];

    document.getElementById("animal")
      .innerText = correctAnimal;

    document.getElementById("message")
      .innerText =
      "Bineensa sirrii tuqi! 👆";
  }


  // FILANNOO BINEENSAA
  function checkAnimal(animal) {

    if (lives <= 0) return;

    if (animal === correctAnimal) {

      score += 10;

      playSound("correct");

      document.getElementById("message")
        .innerText =
        "🎉 Sirrii! +10 ⭐";

      if (score >= level * 50) {

        level++;

        playSound("level");

        document.getElementById("message")
          .innerText =
          "🔥 LEVEL " + level + "!";
      }

    } else {

      lives--;

      playSound("wrong");

      document.getElementById("message")
        .innerText =
        "❌ Dogoggora! ❤️ -1";

      if (lives <= 0) {
        updateInfo();
        gameOver();
        return;
      }
    }

    updateInfo();

    setTimeout(newRound, 700);
  }


  // UPDATE
  function updateInfo() {

    document.getElementById("score")
      .innerText = score;

    document.getElementById("lives")
      .innerText = lives;

    document.getElementById("level")
      .innerText = level;
  }


  // GAME OVER
  function gameOver() {

    document.getElementById("gameScreen")
      .style.display = "none";

    document.getElementById("gameOver")
      .style.display = "block";

    document.getElementById("finalScore")
      .innerText = score;

    document.getElementById("finalMessage")
      .innerText =
      "Galatoomi " +
      document.getElementById("name").innerText +
      "! 🎮";
  }


  // RESTART
  function restartGame() {

    document.getElementById("gameOver")
      .style.display = "none";

    document.getElementById("startScreen")
      .style.display = "block";

    document.getElementById("playerName")
      .value = "";
  }


  // SERVICE WORKER
  if ("serviceWorker" in navigator) {

    window.addEventListener(
      "load",
      function () {

        navigator.serviceWorker.register(
          "./pwabuilder-sw%20(1).js"
        )
        .then(function () {
          console.log(
            "Service Worker registered!"
          );
        })
        .catch(function (error) {
          console.log(
            "Service Worker registration failed:",
            error
          );
        });

      }
    );
  }

</script>

</body>
</html>
